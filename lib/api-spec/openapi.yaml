openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Cottage Pricing API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: settings
  - name: calendar
  - name: bookings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get all control panel settings
      responses:
        "200":
          description: Settings object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update control panel settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /calendar:
    get:
      operationId: getCalendar
      tags: [calendar]
      summary: Get calendar with computed daily prices
      parameters:
        - name: fromYear
          in: query
          required: false
          schema:
            type: integer
          description: First year to include (defaults to current year)
        - name: toYear
          in: query
          required: false
          schema:
            type: integer
          description: Last year to include (defaults to fromYear + 1)
      responses:
        "200":
          description: List of calendar entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEntry"

  /calendar/bulk-days:
    post:
      operationId: setBulkDays
      tags: [calendar]
      summary: Apply sequential day-of-week overrides starting from a given day for all calendar entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDaysRequest"
      responses:
        "200":
          description: Number of entries updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDaysResult"

  /calendar/{date}/override:
    put:
      operationId: setDayOverride
      tags: [calendar]
      summary: Set per-day overrides for season, holiday, or day-of-week
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DayOverrideRequest"
      responses:
        "200":
          description: Updated calendar entry for that date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEntry"
    delete:
      operationId: removeDayOverride
      tags: [calendar]
      summary: Remove per-day override
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Calendar entry with override removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEntry"

  /bookings/calculate:
    post:
      operationId: calculateBooking
      tags: [bookings]
      summary: Calculate total price and nightly breakdown for a date range
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingRequest"
      responses:
        "200":
          description: Booking calculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Season:
      type: object
      properties:
        name:
          type: string
        multiplier:
          type: number
        startDate:
          type: string
          nullable: true
        endDate:
          type: string
          nullable: true
      required: [name, multiplier]

    Holiday:
      type: object
      properties:
        name:
          type: string
        boost:
          type: number
        startDate:
          type: string
          nullable: true
        endDate:
          type: string
          nullable: true
      required: [name, boost]

    DayMultipliers:
      type: object
      properties:
        Monday: { type: number }
        Tuesday: { type: number }
        Wednesday: { type: number }
        Thursday: { type: number }
        Friday: { type: number }
        Saturday: { type: number }
        Sunday: { type: number }
      required: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]

    Settings:
      type: object
      properties:
        basePrice:
          type: number
        familyRate:
          type: number
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/Season"
        dayMultipliers:
          $ref: "#/components/schemas/DayMultipliers"
        holidays:
          type: array
          items:
            $ref: "#/components/schemas/Holiday"
      required: [basePrice, familyRate, seasons, dayMultipliers, holidays]

    DayOverrideRequest:
      type: object
      properties:
        seasonOverride:
          type: string
          nullable: true
        holidayOverride:
          type: string
          nullable: true
        dayOverride:
          type: string
          nullable: true

    BulkDaysRequest:
      type: object
      properties:
        startDay:
          type: string
          description: "Day name to assign to the first calendar entry (e.g. Monday)"
        fromYear:
          type: integer
          nullable: true
        toYear:
          type: integer
          nullable: true
      required: [startDay]

    BulkDaysResult:
      type: object
      properties:
        updated:
          type: integer
      required: [updated]

    CalendarEntry:
      type: object
      properties:
        date:
          type: string
        dayOfWeek:
          type: string
        season:
          type: string
        seasonMult:
          type: number
        dayMult:
          type: number
        holiday:
          type: string
        holidayBoost:
          type: number
        demandAdj:
          type: number
        finalPct:
          type: number
        price:
          type: number
        isOverridden:
          type: boolean
        seasonIsOverridden:
          type: boolean
        holidayIsOverridden:
          type: boolean
        dayIsOverridden:
          type: boolean
        syncedSeason:
          type: string
          nullable: true
        syncedHoliday:
          type: string
          nullable: true
      required: [date, dayOfWeek, season, seasonMult, dayMult, holiday, holidayBoost, demandAdj, finalPct, price, isOverridden, seasonIsOverridden, holidayIsOverridden, dayIsOverridden]

    BookingRequest:
      type: object
      properties:
        startDate:
          type: string
        endDate:
          type: string
        rateType:
          type: string
          nullable: true
        includeMultipliers:
          type: boolean
          nullable: true
      required: [startDate, endDate]

    BookingResult:
      type: object
      properties:
        startDate:
          type: string
        endDate:
          type: string
        nights:
          type: integer
        totalPrice:
          type: number
        avgDailyRate:
          type: number
        rateType:
          type: string
        includeMultipliers:
          type: boolean
        breakdown:
          type: array
          items:
            $ref: "#/components/schemas/CalendarEntry"
      required: [startDate, endDate, nights, totalPrice, avgDailyRate, rateType, includeMultipliers, breakdown]
